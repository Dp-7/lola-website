<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment — LolaLuxExperience</title>
<link rel="stylesheet" href="styles.css">
<!-- Font Awesome for social icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">LolaLuxExperience</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a class="btn-cta" href="book.html">Book Appointment</a>
    </nav>
    <button id="navToggle" class="nav-toggle" aria-label="Toggle nav">☰</button>
  </div>
</header>

<main class="container fade-in">
<section class="section-header">
  <h1>Book Your Appointment</h1>
  <p>Please fill out the form below and we will contact you shortly to confirm your booking.</p>
</section>

<section class="booking-grid">
  <form id="bookingForm" class="booking-form fade-in">
    <label>Full Name <input type="text" name="fullname" required></label>
    <label>Phone <input type="text" name="phone" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Service
      <select name="service" required>
        <option value="">Select a service</option>
        <option>Full Event Planning</option>
        <option>Decor & Floral Design</option>
        <option>On-the-Day Coordination</option>
        <option>Corporate Event</option>
        <option>Intimate Event</option>
        <option>Consultation & Styling</option>
      </select>
    </label>
    <label>Date <input type="date" name="date" required></label>
    <label>Time <input type="time" name="time" required></label>
    <label>Notes <textarea name="notes" rows="4"></textarea></label>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Send Booking Request</button>
    </div>
  </form>
</section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>© <span id="year"></span> LolaLuxExperience</p>
    <nav class="footer-nav">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </nav>
    <div class="footer-social">
      <a href="https://www.instagram.com/yourusername" target="_blank" rel="noopener" class="social-link">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@yourusername" target="_blank" rel="noopener" class="social-link">
        <i class="fab fa-tiktok"></i>
      </a>
    </div>
  </div>
</footer>

<script src="script.js" defer></script>
</body>
</html>
